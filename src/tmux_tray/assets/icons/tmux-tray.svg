<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>tmux-tray</title>

  <!-- Terminal window body -->
  <rect x="10" y="18" width="108" height="92" rx="12" ry="12" fill="#1e1e1e"/>

  <!-- Title bar -->
  <path d="M 10 30 Q 10 18 22 18 L 106 18 Q 118 18 118 30 L 118 34 L 10 34 Z" fill="#2d2d2d"/>

  <!-- Window control dots (macOS-style, but neutral) -->
  <circle cx="22" cy="26" r="2.8" fill="#ff5f56"/>
  <circle cx="32" cy="26" r="2.8" fill="#ffbd2e"/>
  <circle cx="42" cy="26" r="2.8" fill="#27c93f"/>

  <!-- Horizontal pane divider (the iconic tmux split) -->
  <rect x="10" y="68" width="108" height="2" fill="#0a0a0a"/>

  <!-- Upper pane: green prompt caret -->
  <path d="M 20 46 L 30 53 L 20 60" stroke="#27c93f" stroke-width="3.5"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Upper pane: command line dashes -->
  <rect x="38" y="51" width="40" height="4" rx="2" fill="#cccccc"/>

  <!-- Lower pane: green prompt caret -->
  <path d="M 20 82 L 30 89 L 20 96" stroke="#27c93f" stroke-width="3.5"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower pane: active cursor block -->
  <rect x="38" y="86" width="9" height="7" fill="#27c93f" rx="1"/>
  <!-- Lower pane: trailing text -->
  <rect x="52" y="88" width="24" height="3.5" rx="1.5" fill="#888888"/>

  <!-- Status bar (tmux signature green) -->
  <path d="M 10 100 L 118 100 L 118 98 Q 118 110 106 110 L 22 110 Q 10 110 10 98 Z"
        fill="#27c93f"/>

  <!-- Status bar text dots (suggesting session indicators) -->
  <circle cx="20" cy="105" r="1.5" fill="#0a0a0a"/>
  <circle cx="26" cy="105" r="1.5" fill="#0a0a0a"/>
  <circle cx="32" cy="105" r="1.5" fill="#0a0a0a" opacity="0.5"/>
</svg>
